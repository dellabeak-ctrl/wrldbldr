<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Builder — Deck of Worlds Workspace</title>
<style>
  :root{
    --bg: #171a24;
    --bg-dot: #232838;
    --panel: #1e2230;
    --panel-border: #2e3347;
    --text: #e9e8e2;
    --text-dim: #9b9fb0;
    --accent: #d8b86a;
    --card-face: #f6f1e4;
    --card-face-text: #2a2620;

    --c-region: #2d6a4f;
    --c-landmark: #1d4ed8;
    --c-namesake: #7c3aed;
    --c-origin: #92400e;
    --c-attribute: #0f766e;
    --c-advent: #b91c1c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow:hidden; user-select:none;
  }

  /* ---------- Top bar ---------- */
  #topbar{
    position:fixed; top:0; left:0; right:0; height:56px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; background:var(--panel); border-bottom:1px solid var(--panel-border);
    z-index:50;
  }
  #topbar h1{
    font-size:17px; margin:0; font-weight:600; letter-spacing:.3px;
  }
  #topbar h1 span{ color:var(--accent); }
  #topbar .hint{
    font-size:12px; color:var(--text-dim); margin-left:12px; font-weight:400;
  }
  #topbar-right{ display:flex; align-items:center; gap:8px; }
  .btn{
    background:#2a2f42; color:var(--text); border:1px solid var(--panel-border);
    padding:7px 12px; border-radius:6px; font-size:13px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{ background:#343a53; }
  .btn:active{ transform:translateY(1px); }
  .btn.danger:hover{ background:#5a2323; border-color:#7a3030; }
  #zoomctl{ display:flex; align-items:center; gap:4px; }
  #zoomctl .btn{ padding:6px 10px; }
  #zoompct{ font-size:12px; color:var(--text-dim); width:42px; text-align:center; }

  /* ---------- Sidebar (decks) ---------- */
  #sidebar{
    position:fixed; top:56px; bottom:0; left:0; width:196px;
    background:var(--panel); border-right:1px solid var(--panel-border);
    overflow-y:auto; z-index:40; padding:12px 10px;
  }
  #sidebar h2{
    font-size:11px; text-transform:uppercase; letter-spacing:1px;
    color:var(--text-dim); margin:6px 4px 10px;
  }
  .deck{
    background:#252a3b; border:1px solid var(--panel-border); border-radius:8px;
    padding:10px 10px; margin-bottom:10px; cursor:pointer;
    transition: transform .08s ease, background .15s ease;
    position:relative; overflow:hidden;
  }
  .deck:hover{ background:#2b3146; }
  .deck:active{ transform:scale(0.97); }
  .deck::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
    background:var(--deck-color);
  }
  .deck-name{ font-size:13.5px; font-weight:600; margin-bottom:2px; }
  .deck-desc{ font-size:11px; color:var(--text-dim); margin-bottom:8px; line-height:1.35; }
  .deck-row{ display:flex; align-items:center; justify-content:space-between; }
  .deck-count{ font-size:11px; color:var(--text-dim); }
  .deck-reshuffle{
    background:none; border:none; color:var(--text-dim); cursor:pointer;
    font-size:13px; padding:2px 5px; border-radius:4px;
  }
  .deck-reshuffle:hover{ background:#3a4059; color:var(--text); }
  .deck.empty .deck-count{ color:#e8a33d; }

  #sidebar-footer{ margin-top:6px; display:flex; flex-direction:column; gap:8px; }

  /* ---------- Viewport / canvas ---------- */
  #viewport{
    position:fixed; top:56px; left:196px; right:0; bottom:0;
    overflow:hidden; cursor:grab;
    background-color: var(--bg);
    background-image: radial-gradient(var(--bg-dot) 1.4px, transparent 1.4px);
    background-size: 26px 26px;
  }
  #viewport.panning{ cursor:grabbing; }
  #canvas-layer{
    position:absolute; top:0; left:0; width:0; height:0;
    transform-origin: 0 0;
  }

  /* ---------- Cards ---------- */
  .card{
    position:absolute; width:190px; height:190px;
    background:var(--card-face); color:var(--card-face-text);
    border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.45);
    display:flex; flex-direction:column; cursor:grab;
    border:1px solid rgba(0,0,0,.15);
  }
  .card:active{ cursor:grabbing; }
  .card-head{
    background:var(--card-color); color:#fff; padding:7px 10px;
    border-radius:9px 9px 0 0; display:flex; align-items:center; justify-content:space-between;
    font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.6px;
  }
  .card-close{
    background:rgba(255,255,255,.18); border:none; color:#fff; width:18px; height:18px;
    border-radius:50%; cursor:pointer; font-size:12px; line-height:1; display:flex;
    align-items:center; justify-content:center; padding:0;
  }
  .card-close:hover{ background:rgba(255,255,255,.35); }
  .card-number{
    flex:0 0 auto; text-align:center; font-size:38px; font-weight:700;
    font-family: Georgia, "Times New Roman", serif; padding:10px 0 4px;
    color:var(--card-color);
  }
  .card-notes{
    flex:1; margin:0 10px 10px; padding:6px 7px; border-radius:6px;
    background:rgba(0,0,0,.045); font-size:11.5px; line-height:1.4;
    overflow-y:auto; cursor:text; outline:none;
  }
  .card-notes:empty::before{
    content: attr(data-placeholder); color:#8a8375;
  }
  .card-notes:focus{ background:rgba(0,0,0,.09); }

  #empty-state{
    position:fixed; top:56px; left:196px; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; text-align:center; color:var(--text-dim);
    font-size:14px; z-index:5;
  }
  #empty-state.hidden{ display:none; }

  #toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#2a2f42; border:1px solid var(--panel-border); color:var(--text);
    padding:9px 16px; border-radius:8px; font-size:13px; z-index:100;
    opacity:0; transition: opacity .25s ease, transform .25s ease; pointer-events:none;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="topbar">
  <div style="display:flex; align-items:baseline;">
    <h1>World <span>Builder</span></h1>
    <span class="hint">click a deck to draw · drag cards to arrange · scroll to zoom · drag empty space to pan</span>
  </div>
  <div id="topbar-right">
    <div id="zoomctl">
      <button class="btn" id="zoomOut">−</button>
      <span id="zoompct">100%</span>
      <button class="btn" id="zoomIn">+</button>
      <button class="btn" id="zoomReset">Reset view</button>
    </div>
    <button class="btn" id="reshuffleAll">↻ Reshuffle all decks</button>
    <button class="btn danger" id="clearBoard">Clear board</button>
  </div>
</div>

<div id="sidebar">
  <h2>Decks</h2>
  <div id="deck-list"></div>
  <div id="sidebar-footer"></div>
</div>

<div id="viewport">
  <div id="canvas-layer"></div>
</div>

<div id="empty-state">Draw a card from a deck on the left to begin building your world.</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  var DECKS = [
    { key:"region",    name:"Region",    desc:"The terrain and heart of the microsetting.", count:32, color:"var(--c-region)"    },
    { key:"landmark",  name:"Landmark",  desc:"A unique site or point of interest.",         count:48, color:"var(--c-landmark)"  },
    { key:"namesake",  name:"Namesake",  desc:"An in-world nickname the area is known by.",  count:48, color:"var(--c-namesake)"  },
    { key:"origin",    name:"Origin",    desc:"A significant event from the area's past.",  count:32, color:"var(--c-origin)"    },
    { key:"attribute", name:"Attribute", desc:"A present-day feature of the area/people.",   count:48, color:"var(--c-attribute)" },
    { key:"advent",    name:"Advent",    desc:"An event that could change the area's future.", count:32, color:"var(--c-advent)" }
  ];
  var DECK_MAP = {};
  DECKS.forEach(function(d){ DECK_MAP[d.key] = d; });

  var STORAGE_KEY = "world-builder-state-v1";

  var state = {
    decks: {},      // key -> array of remaining numbers
    cards: [],      // {id, deckKey, number, x, y, text, z}
    pan: { x: 0, y: 0 },
    scale: 1,
    nextId: 1,
    nextZ: 1,
    drawCount: 0
  };

  function shuffledRange(n){
    var arr = [];
    for (var i = 1; i <= n; i++) arr.push(i);
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function freshDecks(){
    var d = {};
    DECKS.forEach(function(deck){ d[deck.key] = shuffledRange(deck.count); });
    return d;
  }

  function loadState(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      var parsed = JSON.parse(raw);
      if (!parsed || !parsed.decks || !parsed.cards) return false;
      state = Object.assign(state, parsed);
      return true;
    } catch (e) {
      return false;
    }
  }

  var saveTimer = null;
  function saveState(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
    }, 150);
  }

  if (!loadState()) {
    state.decks = freshDecks();
  }

  // ---------- DOM refs ----------
  var viewport = document.getElementById("viewport");
  var canvasLayer = document.getElementById("canvas-layer");
  var deckListEl = document.getElementById("deck-list");
  var emptyState = document.getElementById("empty-state");
  var zoompct = document.getElementById("zoompct");
  var toastEl = document.getElementById("toast");

  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
  }

  // ---------- Deck sidebar ----------
  function renderDecks(){
    deckListEl.innerHTML = "";
    DECKS.forEach(function(deck){
      var remaining = state.decks[deck.key] ? state.decks[deck.key].length : 0;
      var el = document.createElement("div");
      el.className = "deck" + (remaining === 0 ? " empty" : "");
      el.style.setProperty("--deck-color", deck.color);
      el.innerHTML =
        '<div class="deck-name">' + deck.name + '</div>' +
        '<div class="deck-desc">' + deck.desc + '</div>' +
        '<div class="deck-row">' +
          '<span class="deck-count">' + remaining + ' / ' + deck.count + ' left</span>' +
          '<button class="deck-reshuffle" title="Reshuffle this deck" data-key="' + deck.key + '">↻</button>' +
        '</div>';
      el.addEventListener("click", function(e){
        if (e.target.classList.contains("deck-reshuffle")) return;
        drawCard(deck.key);
      });
      el.querySelector(".deck-reshuffle").addEventListener("click", function(e){
        e.stopPropagation();
        state.decks[deck.key] = shuffledRange(deck.count);
        renderDecks();
        saveState();
        toast(deck.name + " deck reshuffled (" + deck.count + " cards)");
      });
      deckListEl.appendChild(el);
    });
  }

  // ---------- Pan / zoom ----------
  function applyTransform(){
    canvasLayer.style.transform = "translate(" + state.pan.x + "px, " + state.pan.y + "px) scale(" + state.scale + ")";
    zoompct.textContent = Math.round(state.scale * 100) + "%";
  }

  function screenToCanvas(sx, sy){
    return {
      x: (sx - state.pan.x) / state.scale,
      y: (sy - state.pan.y) / state.scale
    };
  }

  function zoomAt(screenX, screenY, newScale){
    newScale = Math.min(3, Math.max(0.25, newScale));
    var before = screenToCanvas(screenX, screenY);
    state.scale = newScale;
    state.pan.x = screenX - before.x * newScale;
    state.pan.y = screenY - before.y * newScale;
    applyTransform();
    saveState();
  }

  document.getElementById("zoomIn").addEventListener("click", function(){
    var r = viewport.getBoundingClientRect();
    zoomAt(r.width/2, r.height/2, state.scale * 1.2);
  });
  document.getElementById("zoomOut").addEventListener("click", function(){
    var r = viewport.getBoundingClientRect();
    zoomAt(r.width/2, r.height/2, state.scale / 1.2);
  });
  document.getElementById("zoomReset").addEventListener("click", function(){
    state.scale = 1; state.pan = { x: 40, y: 40 };
    applyTransform();
    saveState();
  });

  viewport.addEventListener("wheel", function(e){
    e.preventDefault();
    var r = viewport.getBoundingClientRect();
    var sx = e.clientX - r.left, sy = e.clientY - r.top;
    var factor = e.deltaY < 0 ? 1.1 : 0.9;
    zoomAt(sx, sy, state.scale * factor);
  }, { passive:false });

  // panning by dragging empty space
  var isPanning = false, panStart = null;
  viewport.addEventListener("mousedown", function(e){
    if (e.target !== viewport && e.target !== canvasLayer) return;
    isPanning = true;
    viewport.classList.add("panning");
    panStart = { x: e.clientX, y: e.clientY, panX: state.pan.x, panY: state.pan.y };
  });
  window.addEventListener("mousemove", function(e){
    if (!isPanning) return;
    var dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
    state.pan.x = panStart.panX + dx;
    state.pan.y = panStart.panY + dy;
    applyTransform();
  });
  window.addEventListener("mouseup", function(){
    if (isPanning) { isPanning = false; viewport.classList.remove("panning"); saveState(); }
  });

  // ---------- Cards ----------
  function updateEmptyState(){
    emptyState.classList.toggle("hidden", state.cards.length > 0);
  }

  function drawCard(deckKey){
    var deck = DECK_MAP[deckKey];
    if (!state.decks[deckKey] || state.decks[deckKey].length === 0) {
      state.decks[deckKey] = shuffledRange(deck.count);
      toast(deck.name + " deck was empty — reshuffled a fresh set of " + deck.count);
    }
    var number = state.decks[deckKey].pop();

    // Position is driven purely by draw order: the 1st card ever drawn
    // sits at the anchor ("front"), and each subsequent draw steps
    // further down-and-right ("further back"), regardless of deck.
    var STEP_X = 60, STEP_Y = 45;
    var x = state.drawCount * STEP_X;
    var y = state.drawCount * STEP_Y;
    state.drawCount++;

    var card = {
      id: state.nextId++,
      deckKey: deckKey,
      number: number,
      x: x, y: y,
      text: "",
      z: state.nextZ++
    };
    state.cards.push(card);
    renderCard(card);
    renderDecks();
    updateEmptyState();
    saveState();
  }

  function renderCard(card){
    var deck = DECK_MAP[card.deckKey];
    var el = document.createElement("div");
    el.className = "card";
    el.id = "card-" + card.id;
    el.style.left = card.x + "px";
    el.style.top = card.y + "px";
    el.style.zIndex = card.z;
    el.style.setProperty("--card-color", deck.color);
    el.innerHTML =
      '<div class="card-head">' +
        '<span>' + deck.name + ' ' + card.number + '</span>' +
        '<button class="card-close" title="Remove card">✕</button>' +
      '</div>' +
      '<div class="card-number">' + card.number + '</div>' +
      '<div class="card-notes" contenteditable="true" data-placeholder="tap to add notes / card text…"></div>';

    // drag
    el.addEventListener("mousedown", function(e){
      if (e.target.closest(".card-close") || e.target.closest(".card-notes")) return;
      e.stopPropagation();
      bringToFront(card);
      var start = { x: e.clientX, y: e.clientY, cx: card.x, cy: card.y };
      function onMove(ev){
        var dx = (ev.clientX - start.x) / state.scale;
        var dy = (ev.clientY - start.y) / state.scale;
        card.x = start.cx + dx;
        card.y = start.cy + dy;
        el.style.left = card.x + "px";
        el.style.top = card.y + "px";
      }
      function onUp(){
        window.removeEventListener("mousemove", onMove);
        window.removeEventListener("mouseup", onUp);
        saveState();
      }
      window.addEventListener("mousemove", onMove);
      window.addEventListener("mouseup", onUp);
    });

    el.addEventListener("mousedown", function(){ bringToFront(card); }, true);

    el.querySelector(".card-close").addEventListener("click", function(e){
      e.stopPropagation();
      removeCard(card.id);
    });

    var notes = el.querySelector(".card-notes");
    notes.addEventListener("mousedown", function(e){ e.stopPropagation(); });
    notes.addEventListener("input", function(){
      card.text = notes.innerText;
      saveState();
    });

    canvasLayer.appendChild(el);
  }

  function bringToFront(card){
    card.z = state.nextZ++;
    var el = document.getElementById("card-" + card.id);
    if (el) el.style.zIndex = card.z;
  }

  function removeCard(id){
    state.cards = state.cards.filter(function(c){ return c.id !== id; });
    var el = document.getElementById("card-" + id);
    if (el) el.remove();
    updateEmptyState();
    saveState();
  }

  function renderAllCards(){
    canvasLayer.innerHTML = "";
    state.cards.forEach(function(card){
      renderCard(card);
      var el = document.getElementById("card-" + card.id);
      if (el && card.text) el.querySelector(".card-notes").innerText = card.text;
    });
    updateEmptyState();
  }

  document.getElementById("clearBoard").addEventListener("click", function(){
    if (state.cards.length === 0) return;
    if (!confirm("Remove all cards from the board? Deck counts are unaffected.")) return;
    state.cards = [];
    canvasLayer.innerHTML = "";
    updateEmptyState();
    saveState();
    toast("Board cleared");
  });

  document.getElementById("reshuffleAll").addEventListener("click", function(){
    if (!confirm("Reshuffle all six decks back to full? (Cards already on the board are unaffected.)")) return;
    state.decks = freshDecks();
    renderDecks();
    saveState();
    toast("All decks reshuffled");
  });

  // ---------- Init ----------
  renderDecks();
  if (!state.pan.x && !state.pan.y) { state.pan = { x: 40, y: 40 }; }
  applyTransform();
  renderAllCards();

})();
</script>

</body>
</html>
